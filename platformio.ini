;[env:nanoatmega328]
;platform = atmelavr
;board = nanoatmega328
;framework = arduino
;monitor_speed = 9600

[platformio]
default_envs = hit

; Configuração compartilhada
[env]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 9600

; v00 - Base
[env:base]
build_src_filter = +<main_v00_base.cpp>

; v01 - LED Blink
[env:blink]
build_src_filter = +<main_v01_blink.cpp>

; v02 - Piezo Sensor
[env:piezo]
build_src_filter = +<main_v02_piezo.cpp>

; v03 - Evento serial de batida
[env:hit]
build_src_filter = +<main_v03_hit.cpp>
